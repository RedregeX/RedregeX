<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="268" viewBox="0 0 1000 268" role="img" aria-labelledby="title desc">
  <title id="title">RedregeX — personal workspace</title>
  <desc id="desc">A custom pixel X with a slow orbit, beside the name RedregeX. Web, apps, experiments.</desc>
  <defs>
    <radialGradient id="aura"><stop stop-color="#7553c8" stop-opacity=".13"/><stop offset="1" stop-color="#7553c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7553c8"/><stop offset="1" stop-color="#148c85"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".8" fill="#7a88a1" opacity=".12"/></pattern>
    <clipPath id="edge"><rect width="1000" height="268" rx="18"/></clipPath>
  </defs>
  <style>
    .orbit { transform-origin: 0px 0px; animation: revolve 28s linear infinite; }
    .spark { animation: breathe 5s ease-in-out infinite; }
    @keyframes revolve { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .orbit,.spark { animation: none; } }
  </style>
  <g clip-path="url(#edge)">
    <rect width="1000" height="268" fill="#f5f6fa"/>
    <rect x="610" width="390" height="268" fill="url(#dots)"/>
    <circle cx="812" cy="135" r="184" fill="url(#aura)"/>
    <path d="M40 50h22" stroke="#148c85" stroke-width="2"/>
    <text x="74" y="54" fill="#5a6780" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">PERSONAL WORKSPACE</text>
    <text x="39" y="145" fill="#20283c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-3">RedregeX<tspan fill="#7553c8">.</tspan></text>
    <text x="44" y="183" fill="#5a6780" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">web / apps / experiments</text>
    <path d="M44 226h478" stroke="#d6dce8"/>
    <circle cx="44" cy="245" r="2.5" fill="#148c85"/>
    <text x="56" y="249" fill="#5a6780" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">A FEW THINGS I BUILD WITH</text>
    <g transform="translate(812 133)">
      <circle r="103" fill="none" stroke="#d6dce8"/>
      <circle r="83" fill="none" stroke="#d6dce8" stroke-dasharray="2 8" opacity=".8"/>
      <path d="M-125 0h16m218 0h16M0-125v16M0 109v16" stroke="#5a6780" opacity=".4"/>
      <g class="orbit"><circle cx="103" r="4" fill="#148c85"/><circle cx="-103" r="2.5" fill="#7553c8"/></g>
      <rect x="-60" y="-60" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="48" y="-60" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="-42" y="-42" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="30" y="-42" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="-24" y="-24" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="12" y="-24" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#signal)" opacity="1"/><rect x="-24" y="12" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="12" y="12" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="-42" y="30" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="30" y="30" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="-60" y="48" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/><rect x="48" y="48" width="12" height="12" rx="2" fill="url(#signal)" opacity="0.82"/>
      <rect class="spark" x="-7" y="-7" width="14" height="14" rx="2" fill="#20283c"/>
    </g>
    <text x="949" y="249" fill="#5a6780" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="end" letter-spacing="2">RX / 01</text>
  </g>
  <rect x=".5" y=".5" width="999" height="267" rx="17.5" fill="none" stroke="#d6dce8"/>
</svg>
